name: ci

on:
  push:
    branches:
      - main
      - develop
      - "rewrite/**"
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./... -count=1
      - run: go build ./cmd/binas
      - name: Build Go WASM rollback artifact
        run: |
          go env -w GOOS=js GOARCH=wasm
          go build ./cmd/binas-wasm
          go env -u GOOS
          go env -u GOARCH
      - run: rustup component add rustfmt clippy
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p binas-pdf --example public_api_contract
      - run: cargo build --workspace
      - run: cargo build -p binas-pdf-wasm --target wasm32-unknown-unknown
      - name: Browser WASM contract
        if: runner.os == 'Linux'
        run: |
          cargo install wasm-pack --locked --version 0.15.0
          wasm-pack test --headless --chrome bindings/binas-pdf-wasm
      - run: cargo check --manifest-path fuzz/Cargo.toml --bins
