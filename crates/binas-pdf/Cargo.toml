[package]
name = "binas-pdf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Bounded, fail-closed PDF inspection and verified rewrite engine"
readme = "README.md"
keywords = ["pdf", "parser", "security"]
categories = ["parser-implementations"]

[dependencies]
binas-core.workspace = true
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
cms = { version = "0.2.3", features = ["std", "builder"] }
der = { version = "0.7", features = ["alloc", "derive", "oid", "std"] }
flate2 = "1"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
md-5 = "0.10"
rc4 = "0.1"
rsa = { version = "0.9", features = ["getrandom"] }
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10"
sha2 = "0.10"
stringprep = "0.1.5"
subtle = "2"
x509-cert = { version = "0.2", features = ["std"] }
x509-tsp = "0.1.0"
pkix-chain = { version = "0.4.1", default-features = false, features = ["rustcrypto", "crl", "ocsp"] }
quick-xml = { version = "0.41", features = ["serialize"] }

[dev-dependencies]
rcgen = "0.14.8"
x509-ocsp = "0.2.1"
